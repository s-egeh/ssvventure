<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSV Venture — Change Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="admin-auth-storage.js"></script>
    <script src="supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="admin-login.css">
    <link rel="stylesheet" href="admin-change-password.css">
</head>
<body>
    <div class="bg-shape shape1"></div>
    <div class="bg-shape shape2"></div>
    <div class="bg-shape shape3"></div>

    <div id="toast" class="toast" role="status" aria-live="polite" aria-hidden="true">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toast-message">Password updated successfully.</span>
    </div>

    <div class="login-container change-password-container">
        <div class="glass-panel change-password-panel">
            <div class="logo-container">
                <img src="logo.png" alt="SSV Venture Logo" class="logo">
            </div>
            <p class="security-headline">Security Check — You must set a new password to continue.</p>

            <div id="error-message" class="error-message" style="display: none;"></div>

            <form id="changePasswordForm" novalidate>
                <div class="input-group">
                    <i class="fa-solid fa-envelope icon"></i>
                    <input type="email" id="adminEmail" readonly autocomplete="username" aria-label="Your admin email">
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock icon"></i>
                    <input type="password" id="newPassword" required placeholder="New Password" autocomplete="new-password" minlength="8" aria-describedby="strength-label req-list">
                </div>
                <div class="strength-wrap">
                    <div class="strength-meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="strength-label">
                        <div id="strength-bar" class="strength-bar"></div>
                    </div>
                    <span id="strength-label" class="strength-label">Strength: —</span>
                </div>
                <ul id="req-list" class="req-checklist" aria-label="Password requirements">
                    <li data-req="len"><i class="fa-regular fa-circle"></i> Minimum 8 characters</li>
                    <li data-req="upper"><i class="fa-regular fa-circle"></i> At least one uppercase letter</li>
                    <li data-req="num"><i class="fa-regular fa-circle"></i> At least one number</li>
                    <li data-req="special"><i class="fa-regular fa-circle"></i> At least one special character (!@#$%^&amp;*)</li>
                    <li data-req="forbidden"><i class="fa-regular fa-circle"></i> Cannot contain &quot;ssv&quot;, &quot;2013&quot;, or &quot;password&quot;</li>
                </ul>

                <div class="input-group">
                    <i class="fa-solid fa-lock icon"></i>
                    <input type="password" id="confirmPassword" required placeholder="Confirm New Password" autocomplete="new-password" aria-describedby="match-hint">
                </div>
                <p id="match-hint" class="match-hint" aria-live="polite"></p>

                <button type="submit" class="login-btn submit-gold" id="submitBtn">
                    <span>Update password</span>
                    <i class="fa-solid fa-shield-halved"></i>
                </button>
            </form>
        </div>
    </div>

    <script src="admin-change-password.js"></script>
</body>
</html>
