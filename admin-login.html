<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="admin-login.css">
</head>
<body>
    <main class="login-shell">
        <section class="login-brand-panel" aria-hidden="true">
            <div class="brand-content">
                <div class="brand-pill">SSV Venture Secure Portal</div>
                <h1>Fleet Intelligence,<br>Secure Access</h1>
                <p>Centralized control for drivers, trucks, trips, and analytics.</p>
            </div>
        </section>

        <section class="login-form-panel">
            <div class="card">
                <h2>Admin Login</h2>
                <p class="subtext">Sign in to continue.</p>

                <div id="errorBox" class="msg error" role="alert"></div>
                <div id="successBox" class="msg ok" role="status" aria-live="polite"></div>

                <form id="adminLoginForm" novalidate>
                    <div class="field">
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email" autocomplete="email" required>
                    </div>

                    <div class="field">
                        <label for="password">Password</label>
                        <input id="password" name="password" type="password" autocomplete="current-password" required>
                    </div>

                    <div class="row">
                        <label><input id="rememberMe" type="checkbox"> Remember Me</label>
                    </div>

                    <button id="loginBtn" type="submit" class="login-btn">Sign In</button>
                </form>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="admin-auth.js"></script>
</body>
</html>
