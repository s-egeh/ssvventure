<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico?v=2">
    <title>SSV Venture Fleet Management — Admin Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <script src="admin-auth-storage.js"></script>
    <script src="supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="admin-login.css">
</head>
<body>
    <div class="bg-shape shape1"></div>
    <div class="bg-shape shape2"></div>
    <div class="bg-shape shape3"></div>

    <div class="login-container">
        <div class="glass-panel">
            <div class="logo-container">
                <img src="logo.png" alt="SSV Venture Logo" class="logo">
            </div>
            <h2>Admin Secure Portal</h2>
            <p class="subtitle">Fleet & Telemetry Management</p>

            <div id="error-message" class="error-message" style="display: none;" role="alert"></div>
            <div id="success-message" class="success-message" style="display: none;" role="status" aria-live="polite"></div>

            <form id="adminLoginForm">
                <div class="input-group">
                    <i class="fa-solid fa-envelope icon"></i>
                    <input type="email" id="email" required placeholder="Admin Email" autocomplete="off">
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock icon"></i>
                    <input type="password" id="password" required placeholder="Password">
                    <button type="button" class="password-toggle" data-target="password" aria-label="Show password">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>

                <div class="options-group">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberDevice">
                        <span>Remember this device</span>
                    </label>
                    <a href="#" class="forgot-pwd">Forgot Password?</a>
                </div>
                <p class="helper-text">Use the same email address in the reset flow to receive your password link.</p>

                <div class="g-recaptcha" data-sitekey="YOUR_RECAPTCHA_SITE_KEY_HERE" style="margin-bottom: 20px;"></div>

                <button type="submit" class="login-btn">
                    <span>Authenticate</span>
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>
            </form>
        </div>
    </div>

    <script src="admin-auth.js"></script>
</body>
</html>
