<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSV Venture — Required Password Change</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="admin-auth-storage.js"></script>
    <script src="supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="admin-login.css">
    <style>
        .header-shield {
            font-size: 2.75rem;
            color: #22c55e;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 12px rgba(34, 197, 94, 0.35));
        }

        .success-message {
            background: rgba(34, 197, 94, 0.18);
            border-left: 4px solid #22c55e;
            padding: 10px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            border-radius: 4px;
            color: #ecfdf5;
        }

        .login-btn:disabled {
            opacity: 0.75;
            cursor: not-allowed;
            transform: none;
        }

        .login-btn:disabled:hover {
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div class="bg-shape shape1"></div>
    <div class="bg-shape shape2"></div>
    <div class="bg-shape shape3"></div>

    <div class="login-container">
        <div class="glass-panel">
            <div class="logo-container">
                <img src="logo.png" alt="SSV Venture Logo" class="logo">
            </div>

            <div class="header-shield" aria-hidden="true">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h2>Password Update Required</h2>
            <p class="subtitle">You signed in with a default password. Set a new one to continue to the dashboard.</p>

            <div id="error-message" class="error-message" style="display: none;" role="alert"></div>
            <div id="success-message" class="success-message" style="display: none;" role="status" aria-live="polite"></div>

            <form id="forcePasswordForm" novalidate>
                <div class="input-group">
                    <i class="fa-solid fa-lock icon"></i>
                    <input type="password" id="newPassword" name="newPassword" required placeholder="New Password" autocomplete="new-password" minlength="6">
                    <button type="button" class="password-toggle" data-target="newPassword" aria-label="Show new password">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-circle-check icon"></i>
                    <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm New Password" autocomplete="new-password" minlength="6">
                    <button type="button" class="password-toggle" data-target="confirmPassword" aria-label="Show confirm password">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>

                <div id="password-strength" class="password-strength" aria-live="polite">
                    Strength: <span id="password-strength-value">Too weak</span>
                </div>

                <button type="submit" class="login-btn" id="submitBtn">
                    <span class="btn-label">Update &amp; Continue</span>
                    <i class="fa-solid fa-arrow-right btn-arrow"></i>
                </button>
            </form>

            <p class="helper-text helper-text-center">
                Remember your new password for your next login.
                <a href="admin-login.html" class="back-link">Back to login</a>
            </p>
        </div>
    </div>

    <script src="force-password-change.js"></script>
</body>
</html>
