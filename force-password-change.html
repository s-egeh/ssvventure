<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Force Password Change</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: radial-gradient(circle at top, #166534, #0b1022 55%);
            color: #e5e7eb;
            display: grid;
            place-items: center;
            padding: 20px;
        }
        .card {
            width: min(440px, 100%);
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
        }
        h1 { margin: 0 0 8px; font-size: 1.35rem; }
        p { margin: 0 0 18px; color: #94a3b8; font-size: 0.92rem; }
        .field { margin-bottom: 12px; }
        label { display: block; margin-bottom: 6px; font-size: 0.86rem; color: #cbd5e1; }
        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #334155;
            border-radius: 10px;
            background: #0f172a;
            color: #e2e8f0;
        }
        .msg {
            display: none;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }
        .msg.error { background: rgba(220, 38, 38, 0.2); border: 1px solid rgba(220, 38, 38, 0.45); color: #fecaca; }
        .msg.ok { background: rgba(22, 163, 74, 0.2); border: 1px solid rgba(22, 163, 74, 0.45); color: #bbf7d0; }
        button {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 11px 14px;
            font-weight: 700;
            cursor: pointer;
            color: white;
            background: linear-gradient(90deg, #16a34a, #15803d);
        }
        button[disabled] { opacity: 0.7; cursor: not-allowed; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Change Password</h1>
        <p>For security, set a new password before entering the dashboard.</p>

        <div id="errorBox" class="msg error" role="alert"></div>
        <div id="successBox" class="msg ok" role="status" aria-live="polite"></div>

        <form id="forcePasswordForm" novalidate>
            <div class="field">
                <label for="newPassword">New Password</label>
                <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="8" required>
            </div>

            <div class="field">
                <label for="confirmPassword">Confirm New Password</label>
                <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
            </div>

            <button id="submitBtn" type="submit">Update Password</button>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="force-password-change.js"></script>
</body>
</html>
